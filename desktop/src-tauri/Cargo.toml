[package]
name = "clash-speedbench-desktop"
version = "1.1.0-alpha.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.4", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
