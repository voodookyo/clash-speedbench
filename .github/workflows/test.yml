name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零第三方依赖：无需 pip install，直接跑标准库 unittest
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: AST syntax check
        run: |
          python - <<'EOF'
          import ast
          from pathlib import Path
          files = ["clash_speedbench.py", "speedbench_workers.py",
                   "speedbench_web.py", "speedbench_switch.py"]
          for f in files:
              src = Path(f).read_text(encoding="utf-8")
              ast.parse(src, filename=f)
              print(f"{f}: syntax OK")
          EOF
