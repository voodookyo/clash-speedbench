name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零第三方依赖：无需 pip install，直接跑标准库 unittest
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # heredoc（python - <<'EOF'）在 Windows 默认 shell（pwsh）下不可用；
      # 改成单行 python -c，bash 与 pwsh 都能原样执行
      - name: AST syntax check
        run: >-
          python -c "import ast; from pathlib import Path;
          files = ['clash_speedbench.py', 'speedbench_workers.py', 'speedbench_web.py', 'speedbench_switch.py'];
          [ast.parse(Path(f).read_text(encoding='utf-8'), filename=f) for f in files];
          print('AST syntax OK:', ', '.join(files))"
